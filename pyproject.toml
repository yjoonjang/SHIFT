[project]
name = "shift"
version = "1.0.0"
description = "SHIFT: Semantic Harmonization via Index-side Feature Transformation for Multilingual Information Retrieval (EMNLP 2026 Findings)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Youngjoon Jang" },
    { name = "Seongtae Hong" },
    { name = "Hyeonseok Moon" },
    { name = "Heuiseok Lim" },
]
dependencies = [
    "beir>=2.0.0",
    "datasets>=4.5.0",
    "huggingface-hub>=0.26.0",
    "numpy<2.0",
    "sentence-transformers>=5.1.1",
    "torch==2.8.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
# NeuCLIR evaluation (Appendix F) pulls its corpora through mteb.
neuclir = ["mteb>=1.6.35"]
# FastText language-identification robustness experiment (Appendix G).
lid = ["fasttext>=0.9.2"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shift"]
